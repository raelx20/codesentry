name: CodeSentry CI & DevSecOps Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'CodeSentry/package-lock.json'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Linters (Ruff & Bandit)
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Install Node Dependencies
        working-directory: ./CodeSentry
        run: npm install

      - name: Run Unit Tests (232+ tests)
        working-directory: ./CodeSentry
        run: npm run test:unit

      - name: Run Static & Custom Analyzer Tests
        working-directory: ./CodeSentry
        run: npm run test:analyzers

      - name: Run Integration Tests
        working-directory: ./CodeSentry
        run: npm run test:integration

  security-gate:
    name: CodeSentry Self-Inspection & DeployGuard Gate
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'CodeSentry/package-lock.json'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node Dependencies
        working-directory: ./CodeSentry
        run: npm install

      - name: Run DeployGuard Production Readiness Gate
        run: node CodeSentry/bin/codesentry.js deployguard .

      - name: Run CodeSentry Blocker Security Gate
        run: node CodeSentry/bin/codesentry.js scan . --no-ai --severity BLOCKER --gate

      - name: Run Interactive Live Showcase Demo
        run: node CodeSentry/bin/codesentry.js demo
